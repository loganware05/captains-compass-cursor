name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  doctor-and-tests:
    name: Doctor and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Doctor
        run: ./scripts/doctor.sh

      - name: Automated tests
        run: ./tests/run.sh

      - name: Harness evals
        run: ./tests/evals/run.sh

  openui-ui:
    name: OpenUI package (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestrator/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Opt-in Bend law integrity (#278 leftovers). Default CI stays green without
  # Bend: this job is skipped unless repository variable
  # COMPASS_BEND_STRICT_LAWS_CI == '1'. Without a toolchain the check still
  # fails closed on LAWS/SPEC drift vs origin/main; full proofs run only when
  # Bend+Lean are present on the runner.
  bend-law-integrity:
    name: Bend law integrity (opt-in)
    if: ${{ vars.COMPASS_BEND_STRICT_LAWS_CI == '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Law integrity (--strict-laws)
        env:
          COMPASS_BEND_PROOF_ENABLED: "1"
        run: >
          ./scripts/northstar formal check policy-lifecycle
          --strict-laws --base-ref origin/main
          --no-verdict --no-mutations
