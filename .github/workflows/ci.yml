name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  doctor-and-tests:
    name: Doctor and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Doctor
        run: ./scripts/doctor.sh

      - name: Automated tests
        run: ./tests/run.sh

      - name: Harness evals
        run: ./tests/evals/run.sh

  openui-ui:
    name: OpenUI package (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestrator/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
